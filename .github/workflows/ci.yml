name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:8000
      VITE_GOOGLE_CLIENT_ID: ci-test-client-id

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint com ESLint
        run: npm run lint

      - name: Rodar testes com Vitest
        run: npm run test -- --run

      - name: Build de produção
        run: npm run build

  security:
    name: Segurança (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção (high/critical)
        run: npm audit --omit=dev --audit-level=high
